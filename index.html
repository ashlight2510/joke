    .lang-switch {
      position: fixed;

    <script>
      // =========================
      // i18n
      // =========================
      const translations = {
        ko: {
          metaTitle: "오늘의 아재개그 😁 - 매일 새로운 아재개그로 하루를 즐겁게!",
          metaDescription: "오늘의 아재개그 - 매일 새로운 아재개그로 하루를 즐겁게! 문제만 공유하거나 정답까지 공유할 수 있어요. 100개의 엄선된 아재개그 모음",
          title: "오늘의 아재개그 😁",
          loading: "로딩 중...",
          loadingJokes: "아재개그를 불러오는 중...",
          btnShowAnswer: "정답 보기 👀",
          btnHideAnswer: "정답 숨기기 🙈",
          btnShareQuestion: "문제만 공유 📤",
          btnShareWithAnswer: "정답까지 공유 💬",
          btnShareImage: "이미지로 공유 🖼️",
          shareTitle: "오늘의 아재개그",
          shareQuestionTemplate: "오늘의 아재개그 😁\n\nQ. {question}\n\n👇 정답은 사이트에서 보기!\n{url}",
          shareWithAnswerTemplate: "오늘의 아재개그 😁\n\nQ. {question}\n\nA. {answer}",
          shareImageFilename: "오늘의아재개그.png",
          alertCopied: "클립보드에 복사되었습니다!",
          alertImageDownloaded: "이미지가 다운로드되었습니다!",
          alertImageError: "이미지 생성에 실패했습니다.",
          alertLoadError: "아재개그를 불러올 수 없습니다. 페이지를 새로고침해주세요.",
          errorLoadData: "아재개그 데이터를 불러올 수 없습니다.",
          errorLoadJoke: "아재개그를 불러올 수 없습니다.",
          moreTestsBtn: "더 많은 테스트 해보기",
        },
        en: {
          metaTitle: "Daily Dad Jokes 😁 - Start your day with a new joke!",
          metaDescription: "Daily Dad Jokes - Start your day with a new joke! Share just the question or include the answer. Collection of 100 curated dad jokes",
          title: "Daily Dad Jokes 😁",
          loading: "Loading...",
          loadingJokes: "Loading jokes...",
          btnShowAnswer: "Show Answer 👀",
          btnHideAnswer: "Hide Answer 🙈",
          btnShareQuestion: "Share Question 📤",
          btnShareWithAnswer: "Share with Answer 💬",
          btnShareImage: "Share as Image 🖼️",
          shareTitle: "Daily Dad Jokes",
          shareQuestionTemplate: "Daily Dad Jokes 😁\n\nQ. {question}\n\n👇 See the answer on the site!\n{url}",
          shareWithAnswerTemplate: "Daily Dad Jokes 😁\n\nQ. {question}\n\nA. {answer}",
          shareImageFilename: "DailyDadJokes.png",
          alertCopied: "Copied to clipboard!",
          alertImageDownloaded: "Image downloaded!",
          alertImageError: "Failed to generate image.",
          alertLoadError: "Unable to load jokes. Please refresh the page.",
          errorLoadData: "Unable to load joke data.",
          errorLoadJoke: "Unable to load joke.",
          moreTestsBtn: "Explore more tests",
        },
      };

      const defaultLang = "ko";
      const supportedLangs = ["ko", "en"];
      let currentLang = defaultLang;

      function t(key, vars = {}) {
        const langTable = translations[currentLang] || translations.ko;
        let template = langTable?.[key] ?? translations.ko?.[key] ?? key;
        if (typeof template !== "string") return template;
        Object.keys(vars).forEach((k) => {
          template = template.replace(new RegExp(`\\{${k}\\}`, "g"), vars[k]);
        });
        return template;
      }

      function applyTranslations() {
        document.title = t("metaTitle");
        const descMeta = document.querySelector('meta[name="description"]');
        if (descMeta) descMeta.setAttribute("content", t("metaDescription"));
        const ogTitleMeta = document.querySelector('meta[property="og:title"]');
        if (ogTitleMeta) ogTitleMeta.setAttribute("content", t("metaTitle"));
        const ogDescMeta = document.querySelector('meta[property="og:description"]');
        if (ogDescMeta) ogDescMeta.setAttribute("content", t("metaDescription"));
        const twitterTitleMeta = document.querySelector('meta[name="twitter:title"]');
        if (twitterTitleMeta) twitterTitleMeta.setAttribute("content", t("metaTitle"));
        const twitterDescMeta = document.querySelector('meta[name="twitter:description"]');
        if (twitterDescMeta) twitterDescMeta.setAttribute("content", t("metaDescription"));
        document.documentElement.lang = currentLang;
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = t(el.dataset.i18n);
        });
        document.querySelectorAll("[data-i18n-html]").forEach((el) => {
          el.innerHTML = t(el.dataset.i18nHtml);
        });
        document.querySelectorAll("[data-i18n-aria]").forEach((el) => {
          el.setAttribute("aria-label", t(el.dataset.i18nAria));
        });
        document.querySelectorAll("[data-i18n-alt]").forEach((el) => {
          el.setAttribute("alt", t(el.dataset.i18nAlt));
        });
        // 더 많은 테스트 해보기 버튼 텍스트 업데이트
        const moreTestsBtn = document.getElementById('more-tests-btn');
        if (moreTestsBtn) {
          moreTestsBtn.textContent = t('moreTestsBtn');
        }
      }

      function detectLang() {
        const params = new URLSearchParams(window.location.search);
        const paramLang = params.get("lang");
        if (supportedLangs.includes(paramLang)) return paramLang;
        const stored = localStorage.getItem("preferredLang");
        if (supportedLangs.includes(stored)) return stored;
        const browserLang =
          navigator.languages && navigator.languages.length
            ? navigator.languages[0]
            : navigator.language;
        if (browserLang && browserLang.toLowerCase().startsWith("ko")) {
          return "ko";
        }
        return defaultLang;
      }

      function setLang(lang, options = {}) {
        const nextLang = supportedLangs.includes(lang) ? lang : defaultLang;
        currentLang = nextLang;
        window.currentLang = currentLang;
        document.documentElement.lang = nextLang;
        localStorage.setItem("preferredLang", nextLang);
        document.querySelectorAll(".lang-switch button").forEach((button) => {
          button.classList.toggle("active", button.dataset.lang === nextLang);
        });
        applyTranslations();
        if (options.updateUrl) {
          const url = new URL(window.location.href);
          url.searchParams.set("lang", nextLang);
          window.history.replaceState({}, "", url);
        }
        // Update dynamic content if needed
        if (window.updateDateDisplay) window.updateDateDisplay();
        if (window.displayJoke && window.todayJoke) {
          window.displayJoke(window.todayJoke);
        }
      }

      document.querySelectorAll(".lang-switch button").forEach((button) => {
        button.addEventListener("click", () => {
          setLang(button.dataset.lang, { updateUrl: true });
        });
      });

      setLang(detectLang(), { updateUrl: false });

      // Make t() function and currentLang globally available
      window.t = t;
      window.currentLang = currentLang;
      window.setLang = setLang;
    </script>
    <script src="script.js"></script>
  
    
    <script>
      (function () {
        'use strict';
        const targetUrl = 'https://funnyfunny.cloud/';
        
        function updateMoreTestsButton() {
          const btn = document.getElementById('more-tests-btn');
          if (!btn) return;
          const t = window.t || ((key, vars = {}) => key);
          btn.textContent = t('moreTestsBtn');
        }
        
        function addMoreTestsButton() {
          // 이미 버튼이 있으면 텍스트만 업데이트
          let moreBtn = document.getElementById('more-tests-btn');
          if (moreBtn) {
            updateMoreTestsButton();
            return;
          }
          
          moreBtn = document.createElement('button');
          moreBtn.id = 'more-tests-btn';
          moreBtn.type = 'button';
          moreBtn.className = 'more-tests-btn';
          
          const t = window.t || ((key, vars = {}) => key);
          moreBtn.textContent = t('moreTestsBtn');
          
          moreBtn.addEventListener('click', function () {
            window.open(targetUrl, '_blank', 'noopener');
          });
          
          // footer 위에 추가 (main 태그 다음, footer 이전)
          const footer = document.querySelector('footer');
          const container = document.querySelector('.container');
          
          if (footer && footer.parentNode) {
            footer.parentNode.insertBefore(moreBtn, footer);
          } else if (container) {
            // main 태그 다음에 추가
            const main = container.querySelector('main');
            if (main && main.nextSibling) {
              container.insertBefore(moreBtn, main.nextSibling);
            } else {
              container.appendChild(moreBtn);
            }
          } else {
            document.body.appendChild(moreBtn);
          }
        }
        
        function init() {
          // DOM이 완전히 로드된 후 실행
          function tryAddButton() {
            const footer = document.querySelector('footer');
            if (footer || document.querySelector('.container')) {
              addMoreTestsButton();
            } else {
              setTimeout(tryAddButton, 50);
            }
          }
          
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', tryAddButton);
          } else {
            tryAddButton();
          }
          
          // 언어 변경 시 버튼 텍스트 업데이트
          const originalSetLang = window.setLang;
          if (originalSetLang) {
            window.setLang = function(lang, options) {
              originalSetLang(lang, options);
              setTimeout(updateMoreTestsButton, 100);
            };
          }
        }
        
        init();
      })();
    </script>
